site_name: 人工智能与地理数据挖掘
site_description: 《人工智能与地理数据挖掘》课程在线书稿
site_url: https://sunweihunu.github.io/ai-geo-data-mining/
repo_url: https://github.com/sunweihunu/ai-geo-data-mining
repo_name: 课程仓库
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.top
    - navigation.path
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

